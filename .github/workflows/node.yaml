name: node pipeline

on:
  push:
    branches: ["main"]

jobs:
  node:
    runs-on: [self-hosted, x64]
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install package
        run: npm install

      - name: run application
        run: |
          node server.js dev &
          SERVER_PID=$!
          sleep 3
          curl -v http://localhost:3000
          curl -v http://localhost:3000/health
          kill $SERVER_PID || true
